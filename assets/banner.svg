<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="760" viewBox="0 0 1920 760" role="img" aria-labelledby="title desc">
  <title id="title">Khang Minh anime cyberpunk profile banner</title>
  <desc id="desc">A neon anime-inspired GitHub profile banner for wwenrr with a backend engineer HUD, city lights, manga panels, and an original coder character.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07051f"/>
      <stop offset="0.42" stop-color="#151245"/>
      <stop offset="0.72" stop-color="#311052"/>
      <stop offset="1" stop-color="#12071f"/>
    </linearGradient>
    <linearGradient id="pinkGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4da6"/>
      <stop offset="0.5" stop-color="#ff8bd1"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#facc15"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="0.55" stop-color="#fecdd3"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.98 0 1 0 0 0.18 0 0 1 0 0.72 0 0 0 0.75 0" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="cyanSoftGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.12 0 1 0 0 0.82 0 0 1 0 1 0 0 0 0.7 0" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="rightPanel">
      <path d="M1254 62H1844L1776 694H1126Z"/>
    </clipPath>
    <clipPath id="screenClip">
      <rect x="120" y="122" width="790" height="452" rx="34"/>
    </clipPath>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7H8" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

