    </filter>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="2" fill="#f9a8d4" opacity="0.32"/>
    </pattern>
  </defs>

  <rect width="1920" height="460" rx="34" fill="url(#bg)"/>
  <rect width="1920" height="460" rx="34" fill="url(#dots)"/>

