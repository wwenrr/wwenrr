<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="460" viewBox="0 0 1920 460" role="img" aria-labelledby="title desc">
  <title id="title">Soft anime profile banner for Khang Minh</title>
  <desc id="desc">A calm pastel anime-inspired banner for a backend engineer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7fb"/>
      <stop offset="0.44" stop-color="#ffe4f1"/>
      <stop offset="1" stop-color="#e0f7ff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
